# Local development setup. Production is deployed from the
# miljodata-infrastructure repository (services/tabmon/listening-lab and
# services/tabmon/listening-lab-expert), using the image built by GitHub Actions.
x-common-deployment: &default-common-deployment
  # Both app services share a single built image.
  image: tabmon-listening-lab:local
  build:
    context: .
  env_file:
    - ".env"
  deploy:
    replicas: 1
    restart_policy:
      condition: on-failure
      delay: 60s
      max_attempts: 3

services:
  listening-lab-expert:
    <<: *default-common-deployment
    environment:
      APP: expert
    ports:
      - "8505:8501"

  listening-lab-citizen:
    <<: *default-common-deployment
    environment:
      APP: citizen
    ports:
      - "8506:8501"
